[package]
name = "nori-codex-acp"
version = "0.16.0"
edition = "2024"
authors = ["Zed <hi@zed.dev>"]
license = "Apache-2.0"
description = "Codex as an in-process ACP agent for Nori: Codex's sign-in, configuration and catalog on nori-engine"
repository = "https://github.com/zed-industries/codex-acp"
homepage = "https://github.com/zed-industries/codex-acp"

[lib]
doctest = false
name = "nori_codex_acp"
path = "src/lib.rs"

[dependencies]
# Codex's leaf crates (sign-in, configuration, catalog, prompts), vendored from openai/codex
# rust-v0.169.0; see `vendor/codex/README.md`. None of them depends on `codex-core`.
codex-http-client = { path = "../../vendor/codex/http-client" }
codex-config = { path = "../../vendor/codex/config" }
codex-models-manager = { path = "../../vendor/codex/models-manager" }
codex-model-provider-info = { path = "../../vendor/codex/model-provider-info" }
codex-prompts = { path = "../../vendor/codex/prompts" }
codex-protocol = { path = "../../vendor/codex/protocol" }
codex-login = { path = "../../vendor/codex/login" }
nori-acp-kit = { workspace = true }
nori-engine = { workspace = true }
nori-llm = { workspace = true }
base64 = { workspace = true }
dirs = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
toml = { workspace = true }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
chrono = { workspace = true }
tracing = { version = "0.1", features = ["log"] }

[lints.rust]
let-underscore = "warn"
rust-2018-idioms = "warn"
unused = "warn"

[dev-dependencies]
pretty_assertions = "1"
tempfile = { workspace = true }
wiremock = { workspace = true }
base64 = { workspace = true }
