[package]
name = "nori-rex"
version = { workspace = true }
edition = { workspace = true }
license = { workspace = true }

[lints]
workspace = true

# Nori's side of Rex, the terminal multiplexer it often runs in.
[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt", "sync", "time"] }
tracing = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tokio = { workspace = true, features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
