[package]
name = "nori-claude-acp"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Claude Code as an in-process ACP agent for Nori"

[lib]
name = "nori_claude_acp"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
nori-acp-kit = { workspace = true }
# The tools Nori hands an agent built into its own process.
nori-host-tools = { workspace = true }
claude-code-agent-sdk = { version = "0.1.39", features = [] }

tokio = { workspace = true, features = [
    "macros",
    "rt-multi-thread",
    "process",
    "io-util",
    "io-std",
    "sync",
    "time",
    "fs",
] }
tokio-util = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
dashmap = "6.1"
process-wrap = { version = "9.0", features = ["tokio1"] }
tracing = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
dirs = { workspace = true }
globset = "0.4"
regex = "1.12"
chrono = { workspace = true }
base64 = { workspace = true }

[target.'cfg(unix)'.dependencies]
# Reaping the processes the Claude CLI leaves behind.
libc = { workspace = true }

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
serial_test = "3"
