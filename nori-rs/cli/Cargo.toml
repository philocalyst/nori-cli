[package]
name = "nori-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "nori"
path = "src/main.rs"

[lib]
name = "nori_cli"
path = "src/lib.rs"

[lints]
workspace = true

[features]
default = ["native-codex", "native-claude", "native-opencode"]
# Run Codex inside Nori's own process, on Nori's engine (`nori-engine`) with Codex's sign-in,
# config and catalog: no Codex program and no vendored Codex core.
native-codex = ["dep:nori-codex-acp"]
# Run Claude Code through the in-process Rust driver instead of the TypeScript adapter. It still
# starts Claude Code's own CLI; there is no adapter process.
native-claude = ["dep:nori-claude-acp"]
# The ACP adapter is in-process; OpenCode's v2 engine runs as a local server.
native-opencode = ["dep:nori-opencode-acp"]
# Opt-in Gemini Core frontend; the official CLI remains the default.
native-gemini = ["dep:nori-gemini-acp"]
# Opt-in `antigravity-sdk` agent: Antigravity's local harness over its Rust SDK, for API-key and
# Vertex accounts. The default `antigravity` agent is the official `agy acp` process.
native-antigravity-sdk = ["dep:nori-antigravity-acp"]

[dependencies]
anyhow = { workspace = true }
clap = { workspace = true, features = ["derive"] }
clap_complete = { workspace = true }
nori-acp-host = { workspace = true }
nori-harness = { workspace = true }
nori-installed = { workspace = true }
nori-exec = { workspace = true }
nori-fake-agent = { workspace = true }
nori-config = { workspace = true }
codex-arg0 = { workspace = true }
codex-common = { workspace = true, features = ["cli"] }
codex-sandbox = { workspace = true }
codex-execpolicy = { workspace = true }
codex-process-hardening = { workspace = true }
codex-stdio-to-uds = { workspace = true }
nori-tui = { workspace = true }
ctor = { workspace = true }
nori-codex-acp = { path = "../codex-acp", optional = true }
nori-claude-acp = { path = "../claude-acp", optional = true }
nori-opencode-acp = { path = "../opencode-acp", optional = true }
nori-gemini-acp = { path = "../gemini-acp", optional = true }
nori-antigravity-acp = { path = "../antigravity-acp", optional = true }
libc = { workspace = true }
owo-colors = { workspace = true }
regex-lite = { workspace = true}
serde_json = { workspace = true }
supports-color = { workspace = true }
toml = { workspace = true }
tokio = { workspace = true, features = [
    "io-std",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
] }
tracing = { workspace = true }
which = { workspace = true }

[target.'cfg(target_os = "windows")'.dependencies]
codex_windows_sandbox = { package = "codex-windows-sandbox", path = "../windows-sandbox-rs" }

[dev-dependencies]
tokio-util = { workspace = true, features = ["rt"] }
assert_cmd = { workspace = true }
assert_matches = { workspace = true }
predicates = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
