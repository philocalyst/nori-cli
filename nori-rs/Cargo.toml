[workspace.lints.clippy]
expect_used = "deny"
identity_op = "deny"
manual_clamp = "deny"
manual_filter = "deny"
manual_find = "deny"
manual_flatten = "deny"
manual_map = "deny"
manual_memcpy = "deny"
manual_non_exhaustive = "deny"
manual_ok_or = "deny"
manual_range_contains = "deny"
manual_retain = "deny"
manual_strip = "deny"
manual_try_fold = "deny"
manual_unwrap_or = "deny"
needless_borrow = "deny"
needless_borrowed_reference = "deny"
needless_collect = "deny"
needless_late_init = "deny"
needless_option_as_deref = "deny"
needless_question_mark = "deny"
needless_update = "deny"
redundant_clone = "deny"
redundant_closure = "deny"
redundant_closure_for_method_calls = "deny"
redundant_static_lifetimes = "deny"
trivially_copy_pass_by_ref = "deny"
uninlined_format_args = "deny"
unnecessary_filter_map = "deny"
unnecessary_lazy_evaluations = "deny"
unnecessary_sort_by = "deny"
unnecessary_to_owned = "deny"
unwrap_used = "deny"

# cargo-shear cannot see these usages, so we silence the false positives here
# instead of deleting real dependencies.
[workspace.metadata.cargo-shear]
ignored = ["icu_provider", "codex-utils-readiness"]

[profile.dev]
# Keep local edit/build cycles incremental, independently of release packaging.
incremental = true
# Line tables keep file:line in backtraces while avoiding the full DWARF that
# makes the final link memory-bound (slow, can thrash) on low-RAM machines.
debug = "line-tables-only"
# Embedded runtimes make the symbol table large enough to slow macOS validation.
# Keep incremental compilation, but omit distributable symbol names by default.
# Use CARGO_PROFILE_DEV_STRIP=none when debugging needs them.
strip = "symbols"

[profile.release]
lto = "fat"
# Because we bundle some of these executables with the TypeScript CLI, we
# remove everything to make the binary as small as possible.
strip = "symbols"

# See https://github.com/openai/codex/issues/1411 for details.
codegen-units = 1

# Fat-LTO release takes too long to iterate on; this is what the responsiveness
# probe (scripts/perf/pty_probe.py) is measured against.
[profile.perf]
inherits = "release"
lto = "thin"
codegen-units = 16
strip = "none"

[profile.ci-test]
debug = 1         # Reduce debug symbol size
inherits = "test"
opt-level = 0
incremental = false

[patch.crates-io]
# modalkit is vendored (see ../vendor/modalkit/NORI.md): the prompt editor is built on it.
modalkit = { path = "../vendor/modalkit/crates/modalkit" }
keybindings = { path = "../vendor/modalkit/crates/keybindings" }
editor-types = { path = "../vendor/modalkit/crates/editor-types" }
editor-types-macros = { path = "../vendor/modalkit/crates/editor-types-macros" }
editor-types-parser = { path = "../vendor/modalkit/crates/editor-types-parser" }
claude-code-agent-sdk = { path = "claude-acp/vendor/claude-code-agent-sdk" }
# What the upstream Codex crates (codex-acp) are built against; revisions follow openai/codex's own
# [patch] section at the pinned tag.
tokio-tungstenite = { git = "https://github.com/openai-oss-forks/tokio-tungstenite", rev = "7447c427513cfe685f236e1ac0513c4ea3dd9c0b" }
sqlx-core = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
sqlx-sqlite = { git = "https://github.com/transact-rs/sqlx", rev = "10462fa4414c6c7f1ed1d39bb31678e3b726878c" }
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }
# Uncomment to debug local changes.
# ratatui = { path = "../../ratatui" }
crossterm = { git = "https://github.com/openai-oss-forks/crossterm", rev = "45fecb9508105988f42fe6ff0441783ed3717f92" }

# Uncomment to debug local changes.
# rmcp = { path = "../../rust-sdk/crates/rmcp" }

[patch."ssh://git@github.com/openai-oss-forks/tungstenite-rs.git"]
tungstenite = { git = "https://github.com/openai-oss-forks/tungstenite-rs", rev = "bc589d684755a8c02da0fc7e58d0861cbfc306f1" }

# The upstream Codex crates are vendored as path dependencies under the repository-root `vendor/codex`
# instead of a git dependency on openai/codex, whose workspace lives in the nested
# `codex-rs/` directory. Resolvers have to scan a git repository for manifests, and
# some Cargo-compatible tools (for example Mitts) only look at the repository root,
# so the nested workspace makes every build fail to find any Codex package.
# See `../vendor/codex/README.md` for how the vendor tree is produced.
