[package]
name = "nori-opencode-acp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "OpenCode in Nori's process: OpenCode's model gateway with an API key, run by Nori's engine against the gateway's APIs directly"

[dependencies]
dirs = { workspace = true }
nori-acp-kit = { workspace = true }
nori-engine = { workspace = true }
nori-llm = { workspace = true }
reqwest = { workspace = true, features = ["json"] }
serde_json = { workspace = true }
tokio = { workspace = true, features = ["fs", "io-util", "macros", "rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
pretty_assertions = { workspace = true }
tempfile = { workspace = true }
wiremock = { workspace = true }
