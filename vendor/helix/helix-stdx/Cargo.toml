[package]
name = "helix-stdx"
description = "The RFC3986 `Url` newtype from Helix's standard library extensions, vendored for Nori"
version = "25.7.1"
edition = "2021"
license = "MPL-2.0"
repository = "https://github.com/helix-editor/helix"
publish = false

[dependencies]
percent-encoding = "2.3"
serde = { version = "1.0", features = ["derive"] }

[dev-dependencies]
serde_json = "1.0"
