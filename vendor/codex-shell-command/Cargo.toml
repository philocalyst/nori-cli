[package]
name = "codex-shell-command"
version = "0.169.0"
edition = "2024"
license = "Apache-2.0"

# Vendored from openai/codex rust-v0.169.0 with tree-sitter set to the version Nori links, since only one
# copy of that native library may exist in the build.

[lib]
doctest = false

[dependencies]
base64 = "0.22.1"
codex-protocol = { path = "../codex/protocol" }
codex-utils-absolute-path = { path = "../codex/utils/absolute-path" }
libc = "0.2.182"
once_cell = "1.20.2"
regex = "1.12.3"
serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
shlex = "1.3.0"
tree-sitter = "0.27.2"
tree-sitter-bash = "0.25.1"
tree-sitter-powershell = "=0.26.4"
url = "2"
which = "8"
